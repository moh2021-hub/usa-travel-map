spring:
  application:
    name: travelmap

  datasource:
    # Matches database/docker-compose.yml. Override with environment variables in production.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/travelmap}
    username: ${DB_USER:travelmap}
    password: ${DB_PASSWORD:travelmap}

  jpa:
    # The tables are created by the SQL files in /database, not by Hibernate.
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  port: 8080
  compression:
    enabled: true
    mime-types: application/json

app:
  jwt:
    # Signs login tokens. MUST be replaced with your own random value (32+ characters) before deploying.
    secret: ${JWT_SECRET:dev-only-secret-change-me-before-deploying-0123456789}
    ttl-days: 30
  cors:
    # The address the React app is served from.
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
